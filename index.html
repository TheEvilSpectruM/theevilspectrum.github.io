<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>TheEvilSpectrum</title>
  <style>
    body {
      background-color: #000;
      color: #0f0;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 0;
      font-size: 1.5em;
      user-select: none;
    }
    .terminal {
      margin: 15vh auto 0;
      text-shadow: 0 0 2px #0f0, 0 0 4px #0f0, 0 0 6px #0f0;
      min-width: 40ch;
      text-align: center;
    }
    .terminal span {
      font-size: 1em;
    }
    .cursor {
      display: inline-block;
      width: 10px;
      background-color: #0f0;
      margin-left: 2px;
      animation: blink 0.8s step-start infinite;
      box-shadow: 0 0 2px #0f0, 0 0 4px #0f0;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    .projects, .links {
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: left;
    }
    .projects h2, .links h2 {
      margin: 0 0 20px;
      font-size: 1em;
      text-shadow: 0 0 2px #0f0, 0 0 4px #0f0;
      text-align: center;
    }
    .projects ul, .links ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .projects li, .links li {
      position: relative;
      padding: 10px 30px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .projects li:before, .links li:before {
      content: "🁢 ";
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      transition: all 0.3s ease;
    }
    .projects li:after, .links li:after {
      content: "";
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .projects li:hover:before, .links li:hover:before {
      content: "[ ";
      transform: translateY(-50%) scale(1.1);
    }
    .projects li:hover:after, .links li:hover:after {
      content: " ]";
      opacity: 1;
      transform: translateY(-50%) scale(1.1);
    }
    a {
      color: inherit;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="terminal" id="terminal">
    <span id="line1"></span><span id="cursor1" class="cursor">&nbsp;</span>
  </div>

  <div class="projects">
    <h2 id="projects-title"></h2>
    <ul id="projects-list"></ul>
  </div>

  <div class="links">
    <h2 id="links-title"></h2>
    <ul id="links-list"></ul>
  </div>

  <script>
    // Configuration centralisée
    const TYPING_CONFIG = {
      speed: 15,         // Vitesse entre chaque caractère (ms)
      delayBetween: 0, // Délai entre éléments (ms)
      initialDelay: 50  // Délai initial avant démarrage (ms)
    };

    function typeText(element, text, callback) {
      let index = 0;
      function typeChar() {
        if (index < text.length) {
          element.innerHTML += text.charAt(index);
          index++;
          setTimeout(typeChar, TYPING_CONFIG.speed);
        } else if (callback) {
          callback();
        }
      }
      typeChar();
    }

    const terminalTexts = [
      "TheEvilSpectrum/Jojowinner11",
      "Roblox Studio Developper",
      "Learning web languages"
    ];

    function startTyping() {
      const terminal = document.getElementById("terminal");
      const line1 = document.getElementById("line1");

      typeText(line1, terminalTexts[0], function() {
        const cursor1 = document.getElementById("cursor1");
        if (cursor1) { cursor1.parentNode.removeChild(cursor1); }
        terminal.appendChild(document.createElement("br"));
        terminal.appendChild(document.createElement("br"));

        const line2 = document.createElement("span");
        line2.id = "line2";
        terminal.appendChild(line2);
        const cursor2 = document.createElement("span");
        cursor2.id = "cursor2";
        cursor2.className = "cursor";
        cursor2.innerHTML = "&nbsp;";
        terminal.appendChild(cursor2);

        setTimeout(function() {
          typeText(line2, terminalTexts[1], function() {
            if (document.getElementById("cursor2")) {
              document.getElementById("cursor2").parentNode.removeChild(document.getElementById("cursor2"));
            }
            terminal.appendChild(document.createElement("br"));
            const line3 = document.createElement("span");
            line3.id = "line3";
            terminal.appendChild(line3);
            const cursor3 = document.createElement("span");
            cursor3.id = "cursor3";
            cursor3.className = "cursor";
            cursor3.innerHTML = "&nbsp;";
            terminal.appendChild(cursor3);

            setTimeout(function() {
              typeText(line3, terminalTexts[2], function() {
                if (document.getElementById("cursor3")) {
                  document.getElementById("cursor3").parentNode.removeChild(document.getElementById("cursor3"));
                }
                typeProjectsTitle(function() {
                  startProjectTyping(function() {
                    typeLinksTitle(startLinksTyping);
                  });
                });
              });
            }, TYPING_CONFIG.delayBetween);
          });
        }, TYPING_CONFIG.delayBetween);
      });
    }

    function typeProjectsTitle(callback) {
      const titleElement = document.getElementById("projects-title");
      const titleCursor = document.createElement("span");
      titleCursor.id = "projects-title-cursor";
      titleCursor.className = "cursor";
      titleCursor.innerHTML = "&nbsp;";
      titleElement.parentNode.insertBefore(titleCursor, titleElement.nextSibling);
      typeText(titleElement, "Projects", function() {
        if (document.getElementById("projects-title-cursor")) {
          document.getElementById("projects-title-cursor").parentNode.removeChild(document.getElementById("projects-title-cursor"));
        }
        if (callback) callback();
      });
    }

    const projects = [
      { text: "Watermelon", url: "https://www.roblox.com/games/89521560954361/watermelon" },
      { text: "FPV Drone Testing", url: "https://www.roblox.com/games/18146921842/FPV-Drone-Testing" },
      { text: "Scary Things BETA", url: "https://www.roblox.com/games/15587007829/Scary-Things-BETA" },
      { text: "Emilien Obby!", url: "https://www.roblox.com/games/86766176954112/milien-Obby" },
      { text: "McLennan Courthouse SHOWCASE", url: "https://www.roblox.com/games/76489910681746/McLennan-Courthouse-EXTERIOR" },
      { text: "TCL Transport [Cancelled]", url: "" }
    ];

    function startProjectTyping(callback) {
      const projectsList = document.getElementById("projects-list");
      function typeNextProject(i) {
        if (i < projects.length) {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = projects[i].url;
          a.target = "_blank";
          a.style.color = "inherit";
          a.style.textDecoration = "none";
          li.appendChild(a);
          const cursor = document.createElement("span");
          cursor.className = "cursor";
          cursor.innerHTML = "&nbsp;";
          li.appendChild(cursor);
          projectsList.appendChild(li);

          typeText(a, projects[i].text, function() {
            li.removeChild(cursor);
            setTimeout(function() {
              typeNextProject(i + 1);
            }, TYPING_CONFIG.delayBetween);
          });
        } else if (callback) {
          callback();
        }
      }
      typeNextProject(0);
    }

    function typeLinksTitle(callback) {
      const titleElement = document.getElementById("links-title");
      const titleCursor = document.createElement("span");
      titleCursor.id = "links-title-cursor";
      titleCursor.className = "cursor";
      titleCursor.innerHTML = "&nbsp;";
      titleElement.parentNode.insertBefore(titleCursor, titleElement.nextSibling);
      typeText(titleElement, "Links", function() {
        if (document.getElementById("links-title-cursor")) {
          document.getElementById("links-title-cursor").parentNode.removeChild(document.getElementById("links-title-cursor"));
        }
        if (callback) callback();
      });
    }

    const links = [
      { text: "Discord", url: "https://discord.com/users/1075319939306639412" },
      { text: "Github", url: "https://github.com/TheEvilSpectruM" },
      { text: "X (Twitter)", url: "https://x.com/TheEvilSpectrum" },
      { text: "Roblox", url: "https://www.roblox.com/users/3782572743/profile" },
      { text: "Spectrum's Community", url: "https://www.roblox.com/communities/34916784/Spectrums-Community#!/about" }
    ];

    function startLinksTyping() {
      const linksList = document.getElementById("links-list");
      function typeNextLink(i) {
        if (i < links.length) {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = links[i].url;
          a.target = "_blank";
          a.style.color = "inherit";
          a.style.textDecoration = "none";
          li.appendChild(a);
          const cursor = document.createElement("span");
          cursor.className = "cursor";
          cursor.innerHTML = "&nbsp;";
          li.appendChild(cursor);
          linksList.appendChild(li);

          typeText(a, links[i].text, function() {
            li.removeChild(cursor);
            setTimeout(function() {
              typeNextLink(i + 1);
            }, TYPING_CONFIG.delayBetween);
          });
        }
      }
      typeNextLink(0);
    }

    setTimeout(startTyping, TYPING_CONFIG.initialDelay);
  </script>
</body>
</html>
